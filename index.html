<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Photo search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #15171a; color: #e8e8e8; }
  header { position: sticky; top: 0; z-index: 5; background: #1e2125; padding: 14px 20px;
           display: flex; gap: 10px; border-bottom: 1px solid #2c3036; }
  input { flex: 1; padding: 10px 14px; font-size: 16px; border-radius: 8px;
          border: 1px solid #3a3f46; background: #101214; color: inherit; }
  button { padding: 10px 18px; font-size: 15px; border-radius: 8px; border: 0;
           background: #3b82f6; color: white; cursor: pointer; }
  button:disabled { background: #3a3f46; cursor: default; }
  #status { padding: 12px 20px; color: #9aa0a6; font-size: 14px; min-height: 20px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 14px; padding: 0 20px 20px; }
  .card { background: #1e2125; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .card img { width: 100%; height: 200px; object-fit: cover; display: block; background: #101214; }
  .info { padding: 8px 10px; font-size: 12px; color: #9aa0a6; line-height: 1.5; }
  .info b { color: #e8e8e8; font-size: 13px; }
  #more { display: none; margin: 10px auto 40px; }
  /* #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
              z-index: 10; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox img { max-width: 95vw; max-height: 92vh; }
  #lightbox .cap { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
                   font-size: 13px; color: #bbb; } */
  /* #lightbox {
  overflow-y: auto;
  padding: 20px;
  align-items: flex-start;
} */

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .92);
  z-index: 10;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 20px;
  cursor: zoom-out;
}

.lightbox-content {
  position: relative;
  width: min(900px, 95vw);
  margin: auto;
  text-align: center;
  cursor: default;
  z-index: 11;
}

/* .lightbox-content {
  width: min(900px, 95vw);
  margin: auto;
  text-align: center;
  cursor: default;
} */

#lightbox img {
  max-width: 100%;
  max-height: 55vh;
  object-fit: contain;
}

#lightbox .cap {
  position: static;
  margin: 10px 0 20px;
  overflow-wrap: anywhere;
}

#correction-form {
  background: #1e2125;
  border: 1px solid #3a3f46;
  border-radius: 10px;
  padding: 18px;
  text-align: left;
}

#correction-form h3 {
  margin-top: 0;
}

#correction-form label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: #b8bec6;
}

#correction-form input {
  width: 100%;
  min-width: 0;
  flex: initial;
}

.params {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin: 14px 0;
}

#correction-status {
  margin-top: 12px;
  font-size: 14px;
  color: #9aa0a6;
}

@media (max-width: 600px) {
  .params {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>
<body>
<header>
  <input id="q" placeholder="Describe a photo, e.g. a flamingo flying alone" autofocus>
  <button id="go">Search</button>
</header>
<div id="status"></div>
<div id="grid"></div>
<button id="more">Load more</button>
<div id="lightbox">
  <div class="lightbox-content" onclick="event.stopPropagation()">
    <img id="big" onclick="closeBox()"">

    <div class="cap" id="cap"></div>

    <form id="correction-form">
      <h3>Correct embedding</h3>

      <label>
        Correct label
        <input id="correct-text" required
               placeholder="e.g. blue-eared kingfisher">
      </label>

      <div class="params">
        <label>
          Margin
          <input id="margin" type="number" value="0.15"
                 step="0.01" required>
        </label>

        <label>
          Preserve weight
          <input id="preserve-weight" type="number" value="2.0"
                 step="1.0" min="0" required>
        </label>

        <label>
          Learning rate
          <input id="lr" type="number" value="0.01"
                 step="0.01" min="0.01" required>
        </label>

        <label>
          Steps
          <input id="steps" type="number" value="200"
                 min="1" step="1" required>
        </label>
      </div>

      <button id="correct-btn" type="submit">
        Apply correction
      </button>

      <div id="correction-status"></div>
    </form>
  </div>
</div>
<!-- <div id="lightbox"><img id="big"><div class="cap" id="cap"></div></div> -->
 
<script>
const API_BASE = "https://YOUR-BACKEND-URL";
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const moreBtn = document.getElementById("more");
const qInput = document.getElementById("q");
let query = "", offset = 0, total = 0, busy = false;
let selectedImage = null;
 
function line(parts) {
  return parts.filter(Boolean).join("  ·  ");
}

function closeBox() {
    document.getElementById("lightbox").style.display = "none";
}
 
function addCard(r) {
  const card = document.createElement("div");
  card.className = "card";
  card.title = r.raw_path;
 
  const im = document.createElement("img");
  im.loading = "lazy";
  im.src = "/img/" + encodeURIComponent(r.id);
  card.appendChild(im);
 
  const info = document.createElement("div");
  info.className = "info";
  const title = document.createElement("b");
  title.textContent = r.id + "   (" + r.score.toFixed(3) + ")";
  info.appendChild(title);
  info.appendChild(document.createElement("br"));
  info.appendChild(document.createTextNode(line([
    r.date ? r.date.replace("T", " ") : "",
    r.iso ? "ISO " + r.iso : "",
    r.focal ? r.focal + "mm" : "",
    r.f ? "f/" + r.f : "",
    r.exposure || ""
  ])));
  card.appendChild(info);
 
  card.onclick = () => openBox(r);
  grid.appendChild(card);
}
 
async function load() {
  if (busy) return;
  busy = true;
  moreBtn.disabled = true;
  statusEl.textContent = offset === 0 ? "Searching..." : statusEl.textContent;
  try {
    const res = await fetch("/search?q=" + encodeURIComponent(query) + "&offset=" + offset);
    const data = await res.json();
    total = data.total;
    data.results.forEach(addCard);
    offset += data.results.length;
    statusEl.textContent = "Showing " + offset + " of " + total + " for \"" + query + "\"";
    moreBtn.style.display = offset < total ? "block" : "none";
  } catch (e) {
    statusEl.textContent = "Error: " + e;
  }
  busy = false;
  moreBtn.disabled = false;
}
 
function newSearch() {
  const q = qInput.value.trim();
  if (!q) return;
  query = q; offset = 0;
  grid.innerHTML = "";
  moreBtn.style.display = "none";
  window.scrollTo(0, 0);
  load();
}
 
document.getElementById("go").onclick = newSearch;
qInput.addEventListener("keydown", e => { if (e.key === "Enter") newSearch(); });
moreBtn.onclick = load;
 
const box = document.getElementById("lightbox");
// function openBox(r) {
//   document.getElementById("big").src = "/img/" + encodeURIComponent(r.id);
//   document.getElementById("cap").textContent = r.id + "   " + r.raw_path;
//   box.style.display = "flex";
// }

function openBox(r) {
  selectedImage = r;

  document.getElementById("big").src =
    "/img/" + encodeURIComponent(r.id);

  document.getElementById("cap").textContent =
    r.id + "   " + r.raw_path;

  document.getElementById("correct-text").value = "";
  document.getElementById("correction-status").textContent = "";

  box.style.display = "flex";
}

document.getElementById("correction-form").addEventListener(
  "submit",
  async e => {
    e.preventDefault();

    if (!selectedImage || !Number.isInteger(Number(selectedImage.index))) {
      document.getElementById("correction-status").textContent =
        "Missing image embedding index.";
      return;
    }

    const btn = document.getElementById("correct-btn");
    const status = document.getElementById("correction-status");

    btn.disabled = true;
    status.textContent = "Updating embedding...";

    const payload = {
      index: Number(selectedImage.index),
      wrong: query,
      correct: document.getElementById("correct-text").value.trim(),
      margin: Number(document.getElementById("margin").value),
      preserve_weight: Number(
        document.getElementById("preserve-weight").value
      ),
      lr: Number(document.getElementById("lr").value),
      steps: Number(document.getElementById("steps").value)
    };

    try {
      const res = await fetch("/correct", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Correction failed");
      }

      status.textContent = "Correction applied successfully.";
    } catch (err) {
      status.textContent = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }
);
box.onclick = () => { box.style.display = "none"; };
document.addEventListener("keydown", e => { if (e.key === "Escape") box.style.display = "none"; });

</script>
</body>
</html>
