services:
  semantic-search:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - /opt/semantic-search/model/embeddinggemma2:/opt/semantic-search/model/embeddinggemma2:ro
      - /opt/semantic-search/PythonSemanticSearch/embeddings.npz:/app/embeddings.npz:ro
      - /opt/semantic-search/PythonSemanticSearch/convert_results.jsonl:/app/convert_results.jsonl:ro
    restart: unless-stopped